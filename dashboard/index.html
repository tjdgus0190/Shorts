<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorts Factory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">▶</span>
      <div>
        <h1>Shorts Factory</h1>
        <p class="muted">마케터 → 기획자 → 제작자 → 이펙터 → QA → 업로드</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main class="layout">
    <aside class="runs" aria-label="실행 기록">
      <h2 class="section-title">실행 기록</h2>
      <ul id="run-list" class="run-list"></ul>
    </aside>
    <section id="detail" class="detail" aria-live="polite">
      <p class="muted">불러오는 중…</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
